version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: angel-dashboard-dev
    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
      - /workspace/backend/.venv
    ports:
      - "8000:8000"   # Backend API
      - "5173:5173"   # Frontend Dev Server
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ENV=development
    networks:
      - angel-network
    command: /bin/bash

  backend:
    build:
      context: .
      target: runtime
    container_name: angel-backend
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - angel-network
    depends_on:
      - dev
    profiles:
      - production

  frontend:
    image: node:20-alpine
    container_name: angel-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
    networks:
      - angel-network
    command: npm run dev
    profiles:
      - development

networks:
  angel-network:
    driver: bridge
